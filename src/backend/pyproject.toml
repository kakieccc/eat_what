[project]
name = "today-food-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30",
    "httpx>=0.28",
    "langgraph>=1,<2",
    "langchain-core>=1.6.2,<2",
    "openai>=3.8,<4",
    "pwdlib[argon2]>=0.2",
    "alembic>=1.16,<2",
]
[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
